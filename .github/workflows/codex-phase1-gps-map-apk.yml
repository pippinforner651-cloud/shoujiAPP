name: E23 Phase 1.5 GPS Live Fix APK

on:
  push:
    branches:
      - codex/e23-phase1-gps-map-fix
    tags:
      - 'e23-v2-*'
  workflow_dispatch:
    inputs:
      ref:
        description: '必须构建的 Git ref（内测发布请填写 tag，例如 e23-v2-internal-v1）'
        required: true
        type: string
        default: e23-v2-internal-v1

permissions:
  contents: write

concurrency:
  group: e23-phase1-gps-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          # 手动运行严格使用输入 ref；分支 push 使用触发该运行的 ref，绝不默认 checkout main。
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Verify checked out ref
        id: target
        shell: bash
        run: |
          set -euo pipefail
          TARGET_REF='${{ inputs.ref || github.ref }}'
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "target_ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "Checked out ref: $TARGET_REF"
          echo "HEAD SHA: $ACTUAL_SHA"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            EXPECTED_SHA=$(git rev-parse "${TARGET_REF}^{}")
            test "$ACTUAL_SHA" = "$EXPECTED_SHA"
            test "$(git describe --exact-match --tags HEAD)" = "$TARGET_REF"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install exact dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: All frontend tests
        run: npm run test:unit

      - name: Vite production build
        env:
          VITE_COMMIT_SHA: ${{ steps.target.outputs.sha }}
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Android clean build
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Verify signature and prepare artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose "$APK"
          LABEL='${{ inputs.ref || github.ref_name }}'
          SAFE_LABEL=$(printf '%s' "$LABEL" | tr -cd 'A-Za-z0-9._-')
          test -n "$SAFE_LABEL"
          APK_NAME="E23跑起来_${SAFE_LABEL}.apk"
          SHA_NAME="apk-sha256.txt"
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" > "$SHA_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "sha_name=$SHA_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$(cut -d' ' -f1 "$SHA_NAME")" >> "$GITHUB_OUTPUT"
          echo "safe_label=$SAFE_LABEL" >> "$GITHUB_OUTPUT"
          echo "APK name: $APK_NAME"
          echo "APK size: $(wc -c < "$APK_NAME")"
          echo "APK SHA256: $(cut -d' ' -f1 "$SHA_NAME")"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          # 使用清洗后的标签作为 artifact 名（分支名含 / 会非法）
          name: E23跑起来_${{ steps.package.outputs.safe_label }}
          path: |
            ${{ steps.package.outputs.apk_name }}
            ${{ steps.package.outputs.sha_name }}
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 发布 GitHub Release（仅 tag 推送 / 手动指定 tag 时执行）
      # 上传：APK + sha256 + 网页版zip + 完整交付总包
      # 免登录下载：https://github.com/<repo>/releases/tag/<tag>
      # ============================================================
      - name: Build release assets and publish Release
        if: startsWith(github.ref, 'refs/tags/e23-v2-') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG='${{ inputs.ref || github.ref_name }}'
          STAGE=$(mktemp -d)

          # 01_Android
          mkdir -p "$STAGE/01_Android"
          cp "${{ steps.package.outputs.apk_name }}" "$STAGE/01_Android/E23跑起来_V2_内部体验版_Android.apk"
          cp "${{ steps.package.outputs.sha_name }}" "$STAGE/01_Android/apk-sha256.txt"
          cp docs/E23_FINAL_DELIVERY_202608/01_安卓下载与安装说明.md "$STAGE/01_Android/Android安装说明.md"

          # 02_iPhone
          mkdir -p "$STAGE/02_iPhone"
          cp docs/E23_FINAL_DELIVERY_202608/02_苹果iPhone使用说明.md "$STAGE/02_iPhone/PWA使用说明.md"

          # 03_Web（CI 产物 dist）
          mkdir -p "$STAGE/03_Web"
          zip -rq "$STAGE/03_Web/E23跑起来_V2_网页版部署.zip" dist -x "dist/.*"
          printf 'https://1e2a046fcb904f7dabc096741e391932.app.codebuddy.work\n' > "$STAGE/03_Web/PWA正式地址.txt"

          # 04_二维码（CI 生成）
          mkdir -p "$STAGE/04_二维码"
          python -m pip install -q qrcode[pil] 2>/dev/null || pip install -q qrcode[pil]
          python - "$STAGE/04_二维码" "$RELEASE_TAG" <<'PY'
          import qrcode, sys, os
          out, tag = sys.argv[1], sys.argv[2]
          release_url = f"https://github.com/pippinforner651-cloud/shoujiAPP/releases/tag/{tag}"
          pwa_url = "https://1e2a046fcb904f7dabc096741e391932.app.codebuddy.work"
          def mk(data, name):
              q = qrcode.QRCode(version=None, error_correction=qrcode.constants.ERROR_CORRECT_M, box_size=10, border=3)
              q.add_data(data); q.make(fit=True)
              q.make_image(fill_color="black", back_color="white").save(os.path.join(out, name))
          mk(release_url, "QR_Android_APK_正式下载.png")
          mk(pwa_url, "QR_iPhone_PWA.png")
          mk(release_url, "QR_网页版.png")
          mk(pwa_url, "QR_统一入口.png")
          PY

          # 05_交付文档
          mkdir -p "$STAGE/05_交付文档"
          cp docs/E23_FINAL_DELIVERY_202608/00_交付总览.md docs/E23_FINAL_DELIVERY_202608/03_安卓苹果功能差异说明.md \
             docs/E23_FINAL_DELIVERY_202608/04_账号注册与登录说明.md docs/E23_FINAL_DELIVERY_202608/05_开始跑步与结束保存说明.md \
             docs/E23_FINAL_DELIVERY_202608/06_班级总里程与路线说明.md docs/E23_FINAL_DELIVERY_202608/07_已知问题与使用边界.md \
             docs/E23_FINAL_DELIVERY_202608/08_问题反馈模板.md docs/E23_FINAL_DELIVERY_202608/09_版本与校验信息.md \
             docs/E23_FINAL_DELIVERY_202608/11_交付验收清单.md docs/E23_FINAL_DELIVERY_202608/E23跑起来_同学使用入口.md \
             "$STAGE/05_交付文档/"

          # 06_技术交接
          mkdir -p "$STAGE/06_技术交接"
          cp docs/PRODUCT_RULES_FROZEN.md docs/E23_FINAL_DELIVERY_202608/10_开发交接摘要.md \
             docs/E23_FINAL_DELIVERY_202608/sql/E23_restore_stats_triggers.sql \
             docs/E23_FINAL_DELIVERY_202608/sql/E23_restore_stats_triggers_RUNBOOK.md \
             docs/E23_FINAL_DELIVERY_202608/sql/E23_2.1D-2_执行前确认包.md \
             supabase/migrations/007_route_progress_ratio_1_to_1.sql \
             "$STAGE/06_技术交接/"

          # 总包
          (cd "$STAGE" && zip -rq "E23跑起来_V2_最终交付总包_完整版.zip" 01_Android 02_iPhone 03_Web 04_二维码 05_交付文档 06_技术交接)
          cp "$STAGE/E23跑起来_V2_最终交付总包_完整版.zip" .

          # Release（已存在则上传资产，否则创建）
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${{ steps.package.outputs.apk_name }}" "${{ steps.package.outputs.sha_name }}" "$STAGE/03_Web/E23跑起来_V2_网页版部署.zip" "E23跑起来_V2_最终交付总包_完整版.zip" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "${{ steps.package.outputs.apk_name }}" "${{ steps.package.outputs.sha_name }}" \
              "$STAGE/03_Web/E23跑起来_V2_网页版部署.zip" "E23跑起来_V2_最终交付总包_完整版.zip" \
              --repo "${{ github.repository }}" \
              --title "E23跑起来 V2 内部体验版" \
              --notes "E23跑起来 V2 内部体验版（2026-08）· 路线约27,000km · 真实跑量与路线推进 1:1" \
              --latest
          fi
          echo "RELEASE_URL=https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
          echo "APK_SIZE=$(wc -c < "${{ steps.package.outputs.apk_name }}")"
